<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0b;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .footer-wrapper {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 64px 80px;
    }

    .footer {
      display: grid;
      grid-template-columns: 160px repeat(4, 1fr);
      gap: 48px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Logo Column */
    .footer-logo {
      display: flex;
      align-items: flex-start;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 500;
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    .logo svg {
      width: 16px;
      height: 16px;
    }

    /* Link Columns */
    .footer-column {
      display: flex;
      flex-direction: column;
    }

    .footer-column-header {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 18px;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .footer-link {
      font-size: 14px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.5;
      transition: color 0.15s ease;
    }

    .footer-link:hover {
      color: rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body>
  <div class="footer-wrapper">
    <footer class="footer">
      <!-- Logo -->
      <div class="footer-logo">
        <a href="#" class="logo">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="20" height="20" rx="4" fill="rgba(255,255,255,0.25)"/>
            <path d="M6 10.5L8.5 13L14 6.5" stroke="rgba(255,255,255,0.5)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Linear
        </a>
      </div>

    <!-- Features Column -->
    <div class="footer-column">
      <span class="footer-column-header">Features</span>
      <div class="footer-links">
        <a href="#" class="footer-link">Issue Tracking</a>
        <a href="#" class="footer-link">Sprint Planning</a>
        <a href="#" class="footer-link">Project Management</a>
        <a href="#" class="footer-link">Roadmaps</a>
        <a href="#" class="footer-link">Workflows</a>
        <a href="#" class="footer-link">Integrations</a>
      </div>
    </div>

    <!-- Product Column -->
    <div class="footer-column">
      <span class="footer-column-header">Product</span>
      <div class="footer-links">
        <a href="#" class="footer-link">Changelog</a>
        <a href="#" class="footer-link">Download</a>
        <a href="#" class="footer-link">Mobile</a>
        <a href="#" class="footer-link">Integrations</a>
        <a href="#" class="footer-link">Linear Method</a>
        <a href="#" class="footer-link">Pricing</a>
      </div>
    </div>

    <!-- Company Column -->
    <div class="footer-column">
      <span class="footer-column-header">Company</span>
      <div class="footer-links">
        <a href="#" class="footer-link">About</a>
        <a href="#" class="footer-link">Customers</a>
        <a href="#" class="footer-link">Careers</a>
        <a href="#" class="footer-link">Blog</a>
        <a href="#" class="footer-link">Contact</a>
        <a href="#" class="footer-link">Press</a>
      </div>
    </div>

    <!-- Resources Column -->
    <div class="footer-column">
      <span class="footer-column-header">Resources</span>
      <div class="footer-links">
        <a href="#" class="footer-link">Documentation</a>
        <a href="#" class="footer-link">API Reference</a>
        <a href="#" class="footer-link">Security</a>
        <a href="#" class="footer-link">Community</a>
        <a href="#" class="footer-link">Status</a>
        <a href="#" class="footer-link">DPA</a>
      </div>
      </div>
    </footer>
  </div>
</body>
</html>
