<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f0f10;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .feature-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 32px;
            max-width: 960px;
            width: 100%;
        }

        .feature-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .feature-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feature-icon {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            flex-shrink: 0;
        }

        .feature-icon svg {
            width: 100%;
            height: 100%;
        }

        .feature-title {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .feature-description {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="feature-cards">
        <!-- Initiatives -->
        <div class="feature-card">
            <div class="feature-header">
                <div class="feature-icon">
                    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 1L1 4.5L8 8L15 4.5L8 1Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M1 11.5L8 15L15 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M1 8L8 11.5L15 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="feature-title">Initiatives</span>
            </div>
            <p class="feature-description">Coordinate strategic product efforts.</p>
        </div>

        <!-- Cross-team projects -->
        <div class="feature-card">
            <div class="feature-header">
                <div class="feature-icon">
                    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.5"/>
                        <circle cx="3" cy="4" r="1.5" stroke="currentColor" stroke-width="1"/>
                        <circle cx="13" cy="4" r="1.5" stroke="currentColor" stroke-width="1"/>
                        <circle cx="3" cy="12" r="1.5" stroke="currentColor" stroke-width="1"/>
                        <circle cx="13" cy="12" r="1.5" stroke="currentColor" stroke-width="1"/>
                        <path d="M6 6.5L4.5 5" stroke="currentColor" stroke-width="1"/>
                        <path d="M10 6.5L11.5 5" stroke="currentColor" stroke-width="1"/>
                        <path d="M6 9.5L4.5 11" stroke="currentColor" stroke-width="1"/>
                        <path d="M10 9.5L11.5 11" stroke="currentColor" stroke-width="1"/>
                    </svg>
                </div>
                <span class="feature-title">Cross-team projects</span>
            </div>
            <p class="feature-description">Collaborate across teams and departments.</p>
        </div>

        <!-- Milestones -->
        <div class="feature-card">
            <div class="feature-header">
                <div class="feature-icon">
                    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 3L12 8L8 13L4 8L8 3Z" fill="currentColor"/>
                    </svg>
                </div>
                <span class="feature-title">Milestones</span>
            </div>
            <p class="feature-description">Break projects down into concrete phases.</p>
        </div>

        <!-- Progress insights -->
        <div class="feature-card">
            <div class="feature-header">
                <div class="feature-icon">
                    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="1" y="10" width="2.5" height="5" rx="0.5" fill="currentColor"/>
                        <rect x="6.75" y="6" width="2.5" height="9" rx="0.5" fill="currentColor"/>
                        <rect x="12.5" y="2" width="2.5" height="13" rx="0.5" fill="currentColor"/>
                    </svg>
                </div>
                <span class="feature-title">Progress insights</span>
            </div>
            <p class="feature-description">Track scope, velocity, and progress over time.</p>
        </div>
    </div>
</body>
</html>
