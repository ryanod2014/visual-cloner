<!-- Section: faq -->
<section id="faq" class="faq-section">
  <style>
    .faq-section {
      background: rgb(14, 14, 14);
      padding: 80px 24px 120px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .faq-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .faq-heading {
      margin-bottom: 60px;
    }

    .faq-heading-line1 {
      font-size: 64px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.4);
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .faq-heading-line2 {
      font-size: 64px;
      font-weight: 400;
      color: white;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .faq-list {
      display: flex;
      flex-direction: column;
    }

    .faq-item {
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding: 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .faq-item:first-child {
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .faq-question {
      font-size: 18px;
      font-weight: 400;
      color: white;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .faq-toggle {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 20px;
    }

    .faq-toggle::before,
    .faq-toggle::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
    }

    .faq-toggle::before {
      width: 16px;
      height: 1.5px;
    }

    .faq-toggle::after {
      width: 1.5px;
      height: 16px;
    }

    .faq-toggle {
      position: relative;
    }

    .faq-decorative-row {
      display: flex;
      justify-content: space-between;
      padding: 0 40px;
      margin-top: 80px;
    }

    .faq-decorative-dot {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      opacity: 0.25;
    }

    .faq-dot-1 { background: linear-gradient(135deg, #00ffff, #00ff00); }
    .faq-dot-2 { background: linear-gradient(135deg, #00ffff, #0088ff); }
    .faq-dot-3 { background: linear-gradient(135deg, #0066ff, #0044ff); }
    .faq-dot-4 { background: linear-gradient(135deg, #ff00ff, #8800ff); }
    .faq-dot-5 { background: linear-gradient(135deg, #ff6666, #ff4444); }
    .faq-dot-6 { background: linear-gradient(135deg, #ffaa00, #ff8800); }
    .faq-dot-7 { background: linear-gradient(135deg, #88aa00, #668800); }
    .faq-dot-8 { background: linear-gradient(135deg, #aacc00, #88aa00); }
    .faq-dot-9 { background: linear-gradient(135deg, #00ffaa, #00cc88); }
    .faq-dot-10 { background: linear-gradient(135deg, #0088ff, #0066cc); }
  </style>

  <div class="faq-container">
    <div class="faq-heading">
      <h2 class="faq-heading-line1">Frequently asked</h2>
      <h2 class="faq-heading-line2">questions.</h2>
    </div>

    <div class="faq-list">
      <div class="faq-item">
        <p class="faq-question">What makes this product different from others?</p>
        <div class="faq-toggle"></div>
      </div>

      <div class="faq-item">
        <p class="faq-question">How much does it cost to use?</p>
        <div class="faq-toggle"></div>
      </div>

      <div class="faq-item">
        <p class="faq-question">What platforms and devices are supported?</p>
        <div class="faq-toggle"></div>
      </div>

      <div class="faq-item">
        <p class="faq-question">Is there a free trial available?</p>
        <div class="faq-toggle"></div>
      </div>

      <div class="faq-item">
        <p class="faq-question">How do I get started with my account?</p>
        <div class="faq-toggle"></div>
      </div>

      <div class="faq-item">
        <p class="faq-question">What support options are available?</p>
        <div class="faq-toggle"></div>
      </div>
    </div>

    <div class="faq-decorative-row">
      <div class="faq-decorative-dot faq-dot-1"></div>
      <div class="faq-decorative-dot faq-dot-2"></div>
      <div class="faq-decorative-dot faq-dot-3"></div>
      <div class="faq-decorative-dot faq-dot-4"></div>
      <div class="faq-decorative-dot faq-dot-5"></div>
      <div class="faq-decorative-dot faq-dot-6"></div>
      <div class="faq-decorative-dot faq-dot-7"></div>
      <div class="faq-decorative-dot faq-dot-8"></div>
      <div class="faq-decorative-dot faq-dot-9"></div>
      <div class="faq-decorative-dot faq-dot-10"></div>
    </div>
  </div>
</section>
