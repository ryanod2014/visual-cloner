<style>
  .shopify-footer-container {
    background-color: #0a0a0a;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    padding: 60px 40px 40px;
    border-top: 1px solid #1a1a1a;
  }

  .shopify-footer-inner {
    max-width: 1200px;
    margin: 0 auto;
  }

  .shopify-footer-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 48px;
    gap: 16px;
  }

  .shopify-footer-logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .shopify-footer-logo svg {
    width: 32px;
    height: 32px;
  }

  .shopify-footer-logo-text {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .shopify-footer-edition-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: linear-gradient(135deg, rgba(255, 20, 147, 0.15) 0%, rgba(255, 20, 147, 0.05) 100%);
    border: 1px solid rgba(255, 20, 147, 0.3);
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    color: #ff1493;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .shopify-footer-edition-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background-color: #ff1493;
    border-radius: 50%;
    box-shadow: 0 0 8px #ff1493;
  }

  .shopify-footer-divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #333, transparent);
    margin-bottom: 32px;
  }

  .shopify-footer-bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .shopify-footer-links {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .shopify-footer-link {
    color: #888888;
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s ease;
  }

  .shopify-footer-link:hover {
    color: #ffffff;
  }

  .shopify-footer-link-separator {
    width: 4px;
    height: 4px;
    background-color: #333;
    border-radius: 50%;
  }

  .shopify-footer-copyright {
    color: #666666;
    font-size: 13px;
    text-align: center;
  }

  .shopify-footer-small-text {
    color: #444444;
    font-size: 11px;
    text-align: center;
    max-width: 600px;
    line-height: 1.6;
  }

  @media (max-width: 640px) {
    .shopify-footer-container {
      padding: 40px 20px 30px;
    }

    .shopify-footer-links {
      flex-direction: column;
      gap: 12px;
    }

    .shopify-footer-link-separator {
      display: none;
    }
  }
</style>
