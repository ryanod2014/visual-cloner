<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Droplette - One Price</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0e0e0e;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .showcase-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .showcase-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 24px 120px;
            text-align: center;
        }

        .showcase-headline {
            font-size: 72px;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 32px;
        }

        .showcase-headline-line {
            display: block;
        }

        .showcase-description {
            font-size: 20px;
            line-height: 1.5;
            color: #888888;
            max-width: 520px;
            margin-bottom: 40px;
        }

        .showcase-description-highlight {
            color: #ffffff;
        }

        .showcase-buttons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .showcase-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .showcase-btn-primary {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333333;
        }

        .showcase-btn-primary:hover {
            background-color: #252525;
            border-color: #444444;
        }

        .showcase-btn-secondary {
            background-color: #f5f5f5;
            color: #0e0e0e;
        }

        .showcase-btn-secondary:hover {
            background-color: #ffffff;
        }

        .showcase-price-old {
            text-decoration: line-through;
            color: #666666;
            margin-left: 4px;
        }

        .showcase-figma-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .showcase-figma-icon svg {
            width: 100%;
            height: 100%;
        }

        .showcase-rainbow-line {
            width: 100%;
            height: 3px;
            background: linear-gradient(
                90deg,
                #1e3a5f 0%,
                #2d4a6f 10%,
                #3d5a7f 20%,
                #6b5b7a 30%,
                #8b5a6a 40%,
                #c75050 50%,
                #d4a574 60%,
                #b8a888 70%,
                #8a7a6a 80%,
                #5a5a5a 90%,
                #3a3a3a 100%
            );
        }

        .showcase-color-swatches {
            display: flex;
            justify-content: center;
            gap: 48px;
            padding: 40px 24px;
            opacity: 0.3;
        }

        .showcase-swatch {
            width: 48px;
            height: 48px;
            border-radius: 12px;
        }

        .showcase-swatch-1 { background-color: #1e4d6b; }
        .showcase-swatch-2 { background-color: #4a3f5c; }
        .showcase-swatch-3 { background-color: #3d5a8a; }
        .showcase-swatch-4 { background-color: #6b5a6a; }
        .showcase-swatch-5 { background-color: #c75050; }
        .showcase-swatch-6 { background-color: #d4a574; }
        .showcase-swatch-7 { background-color: #8a7a6a; }
        .showcase-swatch-8 { background-color: #5a5a5a; }
        .showcase-swatch-9 { background-color: #3a3a3a; }
        .showcase-swatch-10 { background-color: #2a2a2a; }

        .showcase-footer {
            padding: 60px 24px 80px;
            text-align: center;
        }

        .showcase-footer-text {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            color: #666666;
        }

        .showcase-relay-logo {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
            font-weight: 500;
        }

        .showcase-relay-icon {
            width: 20px;
            height: 20px;
        }

        .showcase-relay-icon svg {
            width: 100%;
            height: 100%;
            fill: #ffffff;
        }

        @media (max-width: 768px) {
            .showcase-headline {
                font-size: 48px;
            }

            .showcase-description {
                font-size: 18px;
            }

            .showcase-buttons {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }

            .showcase-btn {
                width: 100%;
            }

            .showcase-color-swatches {
                gap: 16px;
                flex-wrap: wrap;
            }

            .showcase-swatch {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <section class="showcase-section">
        <div class="showcase-content">
            <h1 class="showcase-headline">
                <span class="showcase-headline-line">One price.</span>
                <span class="showcase-headline-line">No subscription.</span>
            </h1>
            <p class="showcase-description">
                Bring your own API key for OpenAI. Droplette is a single payment. <span class="showcase-description-highlight">Special launch price of $9.</span>
            </p>
            <div class="showcase-buttons">
                <a href="#" class="showcase-btn showcase-btn-primary">
                    Buy license $9 <span class="showcase-price-old">$20</span>
                </a>
                <a href="#" class="showcase-btn showcase-btn-secondary">
                    <span class="showcase-figma-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 24C10.208 24 12 22.208 12 20V16H8C5.792 16 4 17.792 4 20C4 22.208 5.792 24 8 24Z" fill="#0ACF83"/>
                            <path d="M4 12C4 9.792 5.792 8 8 8H12V16H8C5.792 16 4 14.208 4 12Z" fill="#A259FF"/>
                            <path d="M4 4C4 1.792 5.792 0 8 0H12V8H8C5.792 8 4 6.208 4 4Z" fill="#F24E1E"/>
                            <path d="M12 0H16C18.208 0 20 1.792 20 4C20 6.208 18.208 8 16 8H12V0Z" fill="#FF7262"/>
                            <path d="M20 12C20 14.208 18.208 16 16 16C13.792 16 12 14.208 12 12C12 9.792 13.792 8 16 8C18.208 8 20 9.792 20 12Z" fill="#1ABCFE"/>
                        </svg>
                    </span>
                    Try in Figma
                </a>
            </div>
        </div>

        <div class="showcase-rainbow-line"></div>

        <div class="showcase-color-swatches">
            <div class="showcase-swatch showcase-swatch-1"></div>
            <div class="showcase-swatch showcase-swatch-2"></div>
            <div class="showcase-swatch showcase-swatch-3"></div>
            <div class="showcase-swatch showcase-swatch-4"></div>
            <div class="showcase-swatch showcase-swatch-5"></div>
            <div class="showcase-swatch showcase-swatch-6"></div>
            <div class="showcase-swatch showcase-swatch-7"></div>
            <div class="showcase-swatch showcase-swatch-8"></div>
            <div class="showcase-swatch showcase-swatch-9"></div>
            <div class="showcase-swatch showcase-swatch-10"></div>
        </div>

        <footer class="showcase-footer">
            <p class="showcase-footer-text">
                Another Figma plugin crafted by
                <span class="showcase-relay-logo">
                    <span class="showcase-relay-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="currentColor"/>
                            <path d="M15 8L9 12L15 16V8Z" fill="currentColor"/>
                        </svg>
                    </span>
                    Relay
                </span>
            </p>
        </footer>
    </section>
</body>
</html>
