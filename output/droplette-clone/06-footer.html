<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Section</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0e0e0e;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .footer-section {
            background-color: #0e0e0e;
            padding: 80px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        .footer-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .footer-text {
            font-size: 16px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
        }

        .footer-relay-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }

        .footer-relay-link:hover {
            opacity: 0.8;
        }

        .footer-relay-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer-relay-icon svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <footer class="footer-section">
        <div class="footer-content">
            <span class="footer-text">Another Figma plugin crafted by</span>
            <a href="https://relay.app" class="footer-relay-link" target="_blank" rel="noopener noreferrer">
                <span class="footer-relay-icon">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 2C5.58 2 2 5.58 2 10C2 14.42 5.58 18 10 18C14.42 18 18 14.42 18 10C18 5.58 14.42 2 10 2ZM7.5 13.5C6.12 13.5 5 12.38 5 11C5 9.62 6.12 8.5 7.5 8.5C8.88 8.5 10 9.62 10 11C10 12.38 8.88 13.5 7.5 13.5ZM14 11C14 11.55 13.55 12 13 12C12.45 12 12 11.55 12 11C12 10.45 12.45 10 13 10C13.55 10 14 10.45 14 11Z" fill="white"/>
                    </svg>
                </span>
                <span>Relay</span>
            </a>
        </div>
    </footer>
</body>
</html>
