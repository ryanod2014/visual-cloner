<!-- Section: pricing-footer -->
<section id="pricing-footer" class="pricing-footer-section">
  <style>
    .pricing-footer-section {
      background: rgb(14, 14, 14);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0 24px 80px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pricing-footer-card {
      background: rgb(20, 20, 20);
      border: 1px solid rgba(120, 50, 80, 0.4);
      border-radius: 16px;
      padding: 120px 40px;
      max-width: 1000px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .pricing-footer-headline {
      color: white;
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin: 0 0 32px 0;
    }

    .pricing-footer-subtext {
      color: rgba(255, 255, 255, 0.5);
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      margin: 0 0 40px 0;
      max-width: 500px;
    }

    .pricing-footer-highlight {
      color: rgba(255, 255, 255, 0.85);
    }

    .pricing-footer-buttons {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .pricing-footer-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .pricing-footer-btn:hover {
      opacity: 0.9;
    }

    .pricing-footer-btn-primary {
      background: rgba(255, 255, 255, 0.95);
      color: rgb(14, 14, 14);
    }

    .pricing-footer-btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .pricing-footer-strikethrough {
      text-decoration: line-through;
      color: rgba(14, 14, 14, 0.5);
      margin-left: 4px;
    }

    .pricing-footer-figma-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pricing-footer-figma-icon svg {
      width: 16px;
      height: 16px;
    }

    .pricing-footer-dots {
      display: flex;
      justify-content: center;
      gap: 80px;
      margin-top: 60px;
      width: 100%;
      overflow: hidden;
      padding: 20px 0;
    }

    .pricing-footer-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      filter: blur(8px);
      opacity: 0.6;
    }

    .pricing-footer-dot-1 { background: #4ade80; }
    .pricing-footer-dot-2 { background: #a855f7; }
    .pricing-footer-dot-3 { background: #6366f1; }
    .pricing-footer-dot-4 { background: #ec4899; }
    .pricing-footer-dot-5 { background: #f97316; }
    .pricing-footer-dot-6 { background: #eab308; }
    .pricing-footer-dot-7 { background: #22d3ee; }
    .pricing-footer-dot-8 { background: #8b5cf6; }
    .pricing-footer-dot-9 { background: #10b981; }
    .pricing-footer-dot-10 { background: #f472b6; }
  </style>

  <div class="pricing-footer-card">
    <h2 class="pricing-footer-headline">One price.<br>No subscription.</h2>
    <p class="pricing-footer-subtext">
      Bring your own API key for OpenAI. Droplette is a single payment. <span class="pricing-footer-highlight">Special launch price of $9.</span>
    </p>
    <div class="pricing-footer-buttons">
      <a href="#" class="pricing-footer-btn pricing-footer-btn-primary">
        Buy license $9 <span class="pricing-footer-strikethrough">$20</span>
      </a>
      <a href="#" class="pricing-footer-btn pricing-footer-btn-secondary">
        <span class="pricing-footer-figma-icon">
          <svg viewBox="0 0 38 57" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 28.5C19 23.2533 23.2533 19 28.5 19C33.7467 19 38 23.2533 38 28.5C38 33.7467 33.7467 38 28.5 38C23.2533 38 19 33.7467 19 28.5Z" fill="currentColor"/>
            <path d="M0 47.5C0 42.2533 4.25329 38 9.5 38H19V47.5C19 52.7467 14.7467 57 9.5 57C4.25329 57 0 52.7467 0 47.5Z" fill="currentColor"/>
            <path d="M19 0V19H28.5C33.7467 19 38 14.7467 38 9.5C38 4.25329 33.7467 0 28.5 0H19Z" fill="currentColor"/>
            <path d="M0 9.5C0 14.7467 4.25329 19 9.5 19H19V0H9.5C4.25329 0 0 4.25329 0 9.5Z" fill="currentColor"/>
            <path d="M0 28.5C0 33.7467 4.25329 38 9.5 38H19V19H9.5C4.25329 19 0 23.2533 0 28.5Z" fill="currentColor"/>
          </svg>
        </span>
        Try in Figma
      </a>
    </div>
  </div>

  <div class="pricing-footer-dots">
    <div class="pricing-footer-dot pricing-footer-dot-1"></div>
    <div class="pricing-footer-dot pricing-footer-dot-2"></div>
    <div class="pricing-footer-dot pricing-footer-dot-3"></div>
    <div class="pricing-footer-dot pricing-footer-dot-4"></div>
    <div class="pricing-footer-dot pricing-footer-dot-5"></div>
    <div class="pricing-footer-dot pricing-footer-dot-6"></div>
    <div class="pricing-footer-dot pricing-footer-dot-7"></div>
    <div class="pricing-footer-dot pricing-footer-dot-8"></div>
    <div class="pricing-footer-dot pricing-footer-dot-9"></div>
    <div class="pricing-footer-dot pricing-footer-dot-10"></div>
  </div>
</section>
