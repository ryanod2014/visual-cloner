<style>
.resend-logos {
  background: #000000;
  padding: 80px 40px 120px;
  font-family: Inter, ui-sans-serif, system-ui, sans-serif;
  text-align: center;
}

.resend-logos-container {
  max-width: 1200px;
  margin: 0 auto;
}

.resend-logos-divider {
  width: 100%;
  max-width: 900px;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0.15) 80%, transparent 100%);
  margin: 0 auto 60px;
}

.resend-logos-headline {
  color: #888888;
  font-size: 18px;
  font-weight: 400;
  line-height: 1.6;
  margin: 0 0 60px;
}

.resend-logos-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 50px 70px;
  max-width: 1100px;
  margin: 0 auto;
}

.resend-logos-item {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #ffffff;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0.02em;
  opacity: 0.85;
}

.resend-logos-item svg {
  flex-shrink: 0;
}

/* Warner Bros */
.resend-logos-warner {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* Max */
.resend-logos-max {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

/* Raycast */
.resend-logos-raycast {
  font-size: 22px;
  font-weight: 500;
}

/* Mistral AI */
.resend-logos-mistral {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  line-height: 1.2;
}

.resend-logos-mistral-sub {
  font-size: 11px;
  letter-spacing: 0.1em;
}

/* Replit */
.resend-logos-replit {
  font-size: 24px;
  font-weight: 600;
}

/* Anghami */
.resend-logos-anghami {
  font-size: 22px;
  font-weight: 500;
}

/* Gumroad */
.resend-logos-gumroad {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: lowercase;
}

/* fal */
.resend-logos-fal {
  font-size: 28px;
  font-weight: 700;
}

/* Decathlon */
.resend-logos-decathlon {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* Supabase */
.resend-logos-supabase {
  font-size: 22px;
  font-weight: 500;
}

/* Leap */
.resend-logos-leap {
  font-size: 24px;
  font-weight: 500;
}

/* Payload */
.resend-logos-payload {
  font-size: 24px;
  font-weight: 500;
}
</style>
<section class="resend-logos">

          <rect x="11" y="18" width="6" height="6"/>
          <rect x="20" y="18" width="6" height="6"/>

          <rect x="4" y="14" width="6" height="6" rx="1"/>

          <path d="M9 8v10l8-5-8-5z"/>

      <div class="resend-logos-item resend-logos-leap">

      </div>

      <div class="resend-logos-item resend-logos-payload">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
