<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Droplette - Hero</title>
  <style>
    :root {
      --color-background: rgb(14, 14, 14);
      --color-foreground: rgb(255, 255, 255);
      --color-text-primary: rgb(255, 255, 255);
      --color-text-secondary: rgba(255,255,255,0.7);
      --color-text-muted: rgba(255,255,255,0.5);
      --color-heading: rgb(255, 255, 255);
      --color-accent: rgba(255, 255, 255, 0.9);
      --color-accent-foreground: rgb(44, 44, 44);
      --color-card: rgba(0, 0, 0, 0);
      --color-border: rgb(255, 255, 255);
      --color-border-light: rgba(255,255,255,0.05);
      --color-link: rgb(255, 255, 255);
      --font-primary: ui-sans-serif, -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      --font-heading: ui-sans-serif, -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      --text-h1: 69px;
      --text-h2: 69px;
      --text-body: 16px;
      --text-small: 14px;
      --weight-normal: 400;
      --weight-medium: 500;
      --weight-semibold: 600;
      --weight-bold: 700;
      --leading-tight: 1.1;
      --leading-normal: 1.5;
      --tracking-tight: -0.04em;
      --space-section-y: 80px;
      --space-section-x: 24px;
      --space-card: 24px;
      --space-grid-gap: 24px;
      --space-stack-gap: 16px;
      --radius-button: 30px;
      --radius-card: 12px;
      --transition-normal: 250ms;
      --easing: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-primary);
      background-color: var(--color-background);
      color: var(--color-text-primary);
      font-size: var(--text-body);
      line-height: var(--leading-normal);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Navigation */
    .clone-section-0-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 40px;
      position: relative;
      z-index: 100;
    }

    .clone-section-0-logo {
      width: 48px;
      height: 48px;
      position: relative;
    }

    .clone-section-0-logo-ring {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: conic-gradient(
        from 180deg,
        #ff0080 0deg,
        #ff8c00 60deg,
        #ffff00 120deg,
        #00ff00 180deg,
        #00ffff 240deg,
        #0080ff 300deg,
        #ff0080 360deg
      );
      position: relative;
    }

    .clone-section-0-logo-ring::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 8px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--color-background);
    }

    .clone-section-0-logo-drop {
      position: absolute;
      top: 12px;
      left: 16px;
      width: 16px;
      height: 20px;
      background: var(--color-background);
      border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
      z-index: 1;
    }

    .clone-section-0-cta-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: var(--color-foreground);
      color: var(--color-accent-foreground);
      border: none;
      border-radius: var(--radius-button);
      font-family: var(--font-primary);
      font-size: var(--text-body);
      font-weight: var(--weight-medium);
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition-normal) var(--easing);
    }

    .clone-section-0-cta-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .clone-section-0-figma-icon {
      width: 20px;
      height: 20px;
    }

    /* Hero Section */
    .clone-section-0-hero {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Color Glow Background */
    .clone-section-0-glow-bg {
      position: absolute;
      top: -100px;
      left: 0;
      right: 0;
      height: 500px;
      pointer-events: none;
      z-index: 0;
    }

    .clone-section-0-glow-orange {
      position: absolute;
      top: 0;
      left: 15%;
      width: 300px;
      height: 300px;
      background: radial-gradient(ellipse, rgba(255, 100, 0, 0.4) 0%, transparent 70%);
      filter: blur(60px);
    }

    .clone-section-0-glow-red {
      position: absolute;
      top: 50px;
      left: 5%;
      width: 200px;
      height: 200px;
      background: radial-gradient(ellipse, rgba(255, 50, 50, 0.3) 0%, transparent 70%);
      filter: blur(50px);
    }

    .clone-section-0-glow-cyan {
      position: absolute;
      top: 0;
      right: 20%;
      width: 350px;
      height: 350px;
      background: radial-gradient(ellipse, rgba(0, 200, 200, 0.25) 0%, transparent 70%);
      filter: blur(80px);
    }

    .clone-section-0-glow-blue {
      position: absolute;
      top: 100px;
      right: 10%;
      width: 200px;
      height: 200px;
      background: radial-gradient(ellipse, rgba(50, 100, 255, 0.2) 0%, transparent 70%);
      filter: blur(60px);
    }

    /* Hero Content */
    .clone-section-0-hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 60px var(--space-section-x) 40px;
    }

    .clone-section-0-hero-title {
      font-family: var(--font-heading);
      font-size: var(--text-h1);
      font-weight: var(--weight-normal);
      line-height: var(--leading-tight);
      letter-spacing: var(--tracking-tight);
      color: var(--color-heading);
      margin-bottom: 24px;
    }

    .clone-section-0-hero-subtitle {
      font-size: 18px;
      color: var(--color-text-secondary);
      max-width: 580px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .clone-section-0-hero-subtitle strong {
      color: var(--color-text-primary);
      font-weight: var(--weight-normal);
    }

    /* Color Dots Row */
    .clone-section-0-dots-container {
      position: relative;
      z-index: 5;
      width: 100%;
      overflow: hidden;
    }

    .clone-section-0-dots-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0;
      padding: 30px 0;
      position: relative;
    }

    .clone-section-0-dots-row-top {
      margin-bottom: -20px;
    }

    .clone-section-0-dot-cell {
      width: 120px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-right: 1px solid rgba(255,255,255,0.08);
    }

    .clone-section-0-dot-cell:last-child {
      border-right: none;
    }

    .clone-section-0-dot {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      position: relative;
    }

    .clone-section-0-dot-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      filter: blur(20px);
      opacity: 0.5;
    }

    /* Specific dot colors - Row 1 */
    .clone-section-0-dot-teal-dark { background: #1a5a5a; }
    .clone-section-0-dot-teal { background: #2dd4bf; }
    .clone-section-0-dot-teal-light { background: #0ea5a5; }
    .clone-section-0-dot-blue { background: #3b82f6; }
    .clone-section-0-dot-purple { background: #8b5cf6; }
    .clone-section-0-dot-brown { background: #7c5c4a; }
    .clone-section-0-dot-orange { background: #f97316; }
    .clone-section-0-dot-gold { background: #d4a53a; }
    .clone-section-0-dot-cyan-dark { background: #155e75; }

    /* Specific dot colors - Row 2 */
    .clone-section-0-dot-cyan2 { background: #06b6d4; }
    .clone-section-0-dot-orange2 { background: #fb923c; }
    .clone-section-0-dot-blue2 { background: #3b82f6; }
    .clone-section-0-dot-magenta { background: #c026d3; }
    .clone-section-0-dot-red { background: #ef4444; }
    .clone-section-0-dot-gold2 { background: #d97706; }
    .clone-section-0-dot-yellow { background: #fbbf24; }
    .clone-section-0-dot-lime { background: #a3e635; }
    .clone-section-0-dot-teal3 { background: #14b8a6; }
    .clone-section-0-dot-cyan3 { background: #22d3ee; }

    /* UI Mockup Section */
    .clone-section-0-ui-section {
      position: relative;
      z-index: 10;
      padding: 40px var(--space-section-x);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
    }

    .clone-section-0-panel {
      background: rgba(30, 30, 30, 0.8);
      border-radius: var(--radius-card);
      padding: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .clone-section-0-panel-left {
      width: 280px;
      min-height: 380px;
    }

    .clone-section-0-panel-right {
      width: 280px;
      min-height: 380px;
    }

    .clone-section-0-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .clone-section-0-panel-icon {
      width: 20px;
      height: 20px;
      opacity: 0.5;
    }

    .clone-section-0-panel-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
    }

    .clone-section-0-panel-bar {
      height: 8px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
    }

    .clone-section-0-panel-bar-short { width: 40px; }
    .clone-section-0-panel-bar-medium { width: 80px; }
    .clone-section-0-panel-bar-long { width: 120px; }

    .clone-section-0-panel-dot {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
    }

    /* Droplette Center Panel */
    .clone-section-0-droplette-panel {
      background: rgba(40, 40, 40, 0.95);
      border-radius: var(--radius-card);
      padding: 0;
      width: 320px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .clone-section-0-droplette-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: rgba(50, 50, 50, 0.8);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .clone-section-0-droplette-icon {
      width: 16px;
      height: 16px;
      opacity: 0.7;
    }

    .clone-section-0-droplette-title {
      font-size: var(--text-small);
      color: var(--color-text-primary);
      font-weight: var(--weight-normal);
    }

    .clone-section-0-color-palette {
      display: flex;
      height: 360px;
    }

    .clone-section-0-color-strip {
      flex: 1;
    }

    .clone-section-0-strip-orange { background: linear-gradient(to bottom, #f97316, #ea580c); }
    .clone-section-0-strip-red { background: linear-gradient(to bottom, #ef4444, #dc2626); }
    .clone-section-0-strip-yellow { background: linear-gradient(to bottom, #fbbf24, #f59e0b); }
    .clone-section-0-strip-lime { background: linear-gradient(to bottom, #a3e635, #84cc16); }
    .clone-section-0-strip-green { background: linear-gradient(to bottom, #22c55e, #16a34a); }
    .clone-section-0-strip-cyan { background: linear-gradient(to bottom, #06b6d4, #0891b2); }
    .clone-section-0-strip-blue { background: linear-gradient(to bottom, #3b82f6, #2563eb); }
    .clone-section-0-strip-magenta { background: linear-gradient(to bottom, #d946ef, #c026d3); }

    /* Right panel specific */
    .clone-section-0-panel-right .clone-section-0-panel-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .clone-section-0-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f97316, #ea580c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: var(--weight-medium);
      color: white;
    }

    .clone-section-0-toggle {
      width: 44px;
      height: 24px;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      position: relative;
      margin-left: auto;
    }

    .clone-section-0-toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      right: 3px;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
    }

    .clone-section-0-small-icon {
      width: 16px;
      height: 16px;
      opacity: 0.4;
    }

    /* Grid lines overlay */
    .clone-section-0-grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1;
    }

    .clone-section-0-grid-line {
      position: absolute;
      background: rgba(255,255,255,0.03);
    }

    .clone-section-0-grid-line-v {
      width: 1px;
      height: 100%;
    }

    .clone-section-0-grid-line-h {
      width: 100%;
      height: 1px;
    }
  </style>
</head>

  <section class="clone-section-0-hero">
