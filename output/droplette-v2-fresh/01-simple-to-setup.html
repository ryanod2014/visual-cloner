<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Section 1 - AI Tool Hero</title>
  <style>
    :root {
      --color-background: rgb(14, 14, 14);
      --color-foreground: rgb(255, 255, 255);
      --color-text-primary: rgb(255, 255, 255);
      --color-text-secondary: rgba(255,255,255,0.7);
      --color-accent: rgba(255, 255, 255, 0.9);
      --color-accent-foreground: rgb(44, 44, 44);
      --color-border: rgb(255, 255, 255);
      --font-primary: ui-sans-serif, -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      --text-h1: 69px;
      --text-body: 16px;
      --weight-normal: 400;
      --leading-tight: 1.1;
      --tracking-tight: -0.04em;
      --space-section-y: 80px;
      --space-section-x: 24px;
      --radius-card: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .clone-section-1-container {
      background-color: var(--color-background);
      font-family: var(--font-primary);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Color glow effects in background */
    .clone-section-1-glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 500px;
      pointer-events: none;
      z-index: 0;
    }

    .clone-section-1-glow::before {
      content: '';
      position: absolute;
      top: -100px;
      left: 10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255, 100, 50, 0.4) 0%, transparent 70%);
      filter: blur(60px);
    }

    .clone-section-1-glow::after {
      content: '';
      position: absolute;
      top: -80px;
      left: 25%;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(255, 200, 0, 0.3) 0%, transparent 70%);
      filter: blur(50px);
    }

    .clone-section-1-glow-extra {
      position: absolute;
      top: -50px;
      right: 20%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(0, 200, 255, 0.25) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
    }

    .clone-section-1-glow-pink {
      position: absolute;
      top: -60px;
      left: 5%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255, 50, 150, 0.3) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
    }

    /* Main content */
    .clone-section-1-content {
      position: relative;
      z-index: 1;
      padding-top: 120px;
      text-align: center;
    }

    .clone-section-1-headline {
      font-size: var(--text-h1);
      font-weight: var(--weight-normal);
      color: var(--color-text-primary);
      letter-spacing: var(--tracking-tight);
      line-height: var(--leading-tight);
      margin-bottom: 24px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .clone-section-1-subheadline {
      font-size: 18px;
      color: var(--color-text-secondary);
      line-height: 1.5;
      max-width: 600px;
      margin: 0 auto 60px;
    }

    .clone-section-1-subheadline strong {
      color: var(--color-text-primary);
      font-weight: 500;
    }

    /* Color swatches grid background */
    .clone-section-1-swatches-container {
      position: absolute;
      top: 140px;
      left: 0;
      right: 0;
      z-index: 0;
      pointer-events: none;
    }

    .clone-section-1-swatches-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 20px;
      margin-bottom: 160px;
    }

    .clone-section-1-swatch {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      opacity: 0.6;
    }

    .clone-section-1-swatch-row-1 .clone-section-1-swatch:nth-child(1) { background: #0a4a4a; }
    .clone-section-1-swatch-row-1 .clone-section-1-swatch:nth-child(2) { background: #2a7a9a; }
    .clone-section-1-swatch-row-1 .clone-section-1-swatch:nth-child(3) { background: #3a5aaa; }
    .clone-section-1-swatch-row-1 .clone-section-1-swatch:nth-child(4) { background: #5a3a6a; }
    .clone-section-1-swatch-row-1 .clone-section-1-swatch:nth-child(5) { background: #7a4a2a; }
    .clone-section-1-swatch-row-1 .clone-section-1-swatch:nth-child(6) { background: #aa5500; }
    .clone-section-1-swatch-row-1 .clone-section-1-swatch:nth-child(7) { background: #8a7a20; }
    .clone-section-1-swatch-row-1 .clone-section-1-swatch:nth-child(8) { background: #6a8a30; }
    .clone-section-1-swatch-row-1 .clone-section-1-swatch:nth-child(9) { background: #4a6a5a; }
    .clone-section-1-swatch-row-1 .clone-section-1-swatch:nth-child(10) { background: #2a5a6a; }
    .clone-section-1-swatch-row-1 .clone-section-1-swatch:nth-child(11) { background: #3a6a8a; }

    .clone-section-1-swatch-row-2 .clone-section-1-swatch:nth-child(1) { background: #00aaaa; }
    .clone-section-1-swatch-row-2 .clone-section-1-swatch:nth-child(2) { background: #00bbcc; }
    .clone-section-1-swatch-row-2 .clone-section-1-swatch:nth-child(3) { background: #2288dd; }
    .clone-section-1-swatch-row-2 .clone-section-1-swatch:nth-child(4) { background: #8833aa; }
    .clone-section-1-swatch-row-2 .clone-section-1-swatch:nth-child(5) { background: #ee5500; }
    .clone-section-1-swatch-row-2 .clone-section-1-swatch:nth-child(6) { background: #ddaa00; }
    .clone-section-1-swatch-row-2 .clone-section-1-swatch:nth-child(7) { background: #bbaa00; }
    .clone-section-1-swatch-row-2 .clone-section-1-swatch:nth-child(8) { background: #99bb00; }
    .clone-section-1-swatch-row-2 .clone-section-1-swatch:nth-child(9) { background: #55aa88; }
    .clone-section-1-swatch-row-2 .clone-section-1-swatch:nth-child(10) { background: #33aaaa; }
    .clone-section-1-swatch-row-2 .clone-section-1-swatch:nth-child(11) { background: #44bbcc; }

    /* UI Mockups Container */
    .clone-section-1-mockups {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      padding: 0 40px;
      position: relative;
      z-index: 2;
      margin-top: -20px;
    }

    /* Left Panel - Figma layers panel */
    .clone-section-1-panel-left {
      width: 280px;
      background: rgba(30, 30, 30, 0.95);
      border-radius: var(--radius-card);
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .clone-section-1-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .clone-section-1-panel-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.5);
    }

    .clone-section-1-panel-icon svg {
      width: 16px;
      height: 16px;
    }

    .clone-section-1-layer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
    }

    .clone-section-1-layer-arrow {
      width: 12px;
      height: 12px;
      color: rgba(255, 255, 255, 0.4);
    }

    .clone-section-1-layer-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .clone-section-1-layer-bar-wide { width: 100px; }
    .clone-section-1-layer-bar-medium { width: 60px; }
    .clone-section-1-layer-bar-short { width: 40px; }

    .clone-section-1-search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 8px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .clone-section-1-search-icon {
      color: rgba(255, 255, 255, 0.4);
    }

    .clone-section-1-add-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
    }

    .clone-section-1-add-icon {
      color: rgba(255, 255, 255, 0.4);
      font-size: 16px;
    }

    /* Center Panel - Droplette color picker */
    .clone-section-1-panel-center {
      width: 320px;
      background: rgba(40, 40, 40, 0.98);
      border-radius: var(--radius-card);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      z-index: 3;
    }

    .clone-section-1-droplette-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(50, 50, 50, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .clone-section-1-droplette-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.6);
      position: relative;
    }

    .clone-section-1-droplette-icon::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
    }

    .clone-section-1-droplette-title {
      color: var(--color-text-primary);
      font-size: 14px;
      font-weight: 500;
    }

    .clone-section-1-color-bars {
      display: flex;
      padding: 8px;
      gap: 4px;
      height: 380px;
    }

    .clone-section-1-color-bar {
      flex: 1;
      border-radius: 4px;
    }

    .clone-section-1-color-bar:nth-child(1) { background: linear-gradient(to bottom, #ff4500, #cc3300); }
    .clone-section-1-color-bar:nth-child(2) { background: linear-gradient(to bottom, #ff6600, #dd5500); }
    .clone-section-1-color-bar:nth-child(3) { background: linear-gradient(to bottom, #ffaa00, #ee9900); }
    .clone-section-1-color-bar:nth-child(4) { background: linear-gradient(to bottom, #aadd00, #99cc00); }
    .clone-section-1-color-bar:nth-child(5) { background: linear-gradient(to bottom, #66ee00, #55dd00); }
    .clone-section-1-color-bar:nth-child(6) { background: linear-gradient(to bottom, #00dddd, #00cccc); }
    .clone-section-1-color-bar:nth-child(7) { background: linear-gradient(to bottom, #00aaff, #0099ee); }
    .clone-section-1-color-bar:nth-child(8) { background: linear-gradient(to bottom, #dd44ff, #cc33ee); }
    .clone-section-1-color-bar:nth-child(9) { background: linear-gradient(to bottom, #ff00aa, #ee0099); }

    /* Right Panel - Figma properties panel */
    .clone-section-1-panel-right {
      width: 280px;
      background: rgba(35, 35, 38, 0.95);
      border-radius: var(--radius-card);
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .clone-section-1-right-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .clone-section-1-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }

    .clone-section-1-right-icons {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .clone-section-1-play-icon {
      width: 20px;
      height: 20px;
      color: rgba(255, 255, 255, 0.5);
    }

    .clone-section-1-share-btn {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.7);
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
    }

    .clone-section-1-prop-section {
      margin-bottom: 16px;
    }

    .clone-section-1-prop-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .clone-section-1-prop-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .clone-section-1-prop-bar-xs { width: 30px; }
    .clone-section-1-prop-bar-sm { width: 50px; }
    .clone-section-1-prop-bar-md { width: 80px; }
    .clone-section-1-prop-bar-lg { width: 100px; }

    .clone-section-1-prop-icon {
      width: 16px;
      height: 16px;
      color: rgba(255, 255, 255, 0.4);
      flex-shrink: 0;
    }

    .clone-section-1-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 16px 0;
    }

    .clone-section-1-color-preview-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .clone-section-1-color-preview {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: #888;
    }

    .clone-section-1-color-preview-2 {
      background: linear-gradient(45deg, #aaa 25%, transparent 25%),
                  linear-gradient(-45deg, #aaa 25%, transparent 25%),
                  linear-gradient(45deg, transparent 75%, #aaa 75%),
                  linear-gradient(-45deg, transparent 75%, #aaa 75%);
      background-size: 8px 8px;
      background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
    }
  </style>
</head>
<body>
  <section class="clone-section-1-container">
    <!-- Background glows -->
    <div class="clone-section-1-glow"></div>
    <div class="clone-section-1-glow-extra"></div>
    <div class="clone-section-1-glow-pink"></div>

    <!-- Color swatches background -->
    <div class="clone-section-1-swatches-container">
      <div class="clone-section-1-swatches-row clone-section-1-swatch-row-1">
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
      </div>
      <div class="clone-section-1-swatches-row clone-section-1-swatch-row-2">
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
        <div class="clone-section-1-swatch"></div>
      </div>
    </div>

    <!-- Main content -->
    <div class="clone-section-1-content">
      <h1 class="clone-section-1-headline">An AI tool made to<br>enhance designers.</h1>
      <p class="clone-section-1-subheadline">Create palettes in Figma & FigJam based on your color styles easily with <strong>Droplette, AI that works for you.</strong></p>
    </div>

    <!-- UI Mockups -->
    <div class="clone-section-1-mockups">
      <!-- Left Panel -->
      <div class="clone-section-1-panel-left">
        <div class="clone-section-1-panel-header">
          <div class="clone-section-1-panel-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
            </svg>
          </div>
          <div class="clone-section-1-panel-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M9 3v18"/>
            </svg>
          </div>
        </div>
        <div class="clone-section-1-layer-row">
          <span class="clone-section-1-layer-arrow">▼</span>
          <div class="clone-section-1-layer-bar clone-section-1-layer-bar-wide"></div>
        </div>
        <div class="clone-section-1-layer-row">
          <div class="clone-section-1-layer-bar clone-section-1-layer-bar-medium" style="margin-left: 20px;"></div>

        <div class="clone-section-1-search-row">
          <div class="clone-section-1-layer-bar clone-section-1-layer-bar-short"></div>
          <div class="clone-section-1-layer-bar clone-section-1-layer-bar-short"></div>
          <span class="clone-section-1-search-icon" style="margin-left: auto;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.35-4.35"/>
            </svg>
          </span>
        </div>
        <div class="clone-section-1-add-row">
          <span class="clone-section-1-layer-arrow">▼</span>
          <div class="clone-section-1-layer-bar clone-section-1-layer-bar-medium"></div>
          <span class="clone-section-1-add-icon" style="margin-left: auto;">+</span>
        </div>
        <div class="clone-section-1-layer-row">
          <span class="clone-section-1-layer-arrow">▼</span>
          <div class="clone-section-1-layer-bar clone-section-1-layer-bar-short"></div>
        </div>
      </div>

      <!-- Center Panel - Droplette -->
      <div class="clone-section-1-panel-center">
        <div class="clone-section-1-droplette-header">
          <div class="clone-section-1-droplette-icon"></div>
          <span class="clone-section-1-droplette-title">Droplette</span>
        </div>
        <div class="clone-section-1-color-bars">
          <div class="clone-section-1-color-bar"></div>
          <div class="clone-section-1-color-bar"></div>
          <div class="clone-section-1-color-bar"></div>
          <div class="clone-section-1-color-bar"></div>
          <div class="clone-section-1-color-bar"></div>
          <div class="clone-section-1-color-bar"></div>
          <div class="clone-section-1-color-bar"></div>
          <div class="clone-section-1-color-bar"></div>
          <div class="clone-section-1-color-bar"></div>
        </div>
      </div>

      <!-- Right Panel -->
      <div class="clone-section-1-panel-right">
        <div class="clone-section-1-right-header">
          <div class="clone-section-1-avatar">S</div>
          <div class="clone-section-1-right-icons">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="5,3 19,12 5,21"/>
              </svg>
            </span>
            <button class="clone-section-1-share-btn">Share</button>
          </div>
        </div>
        <div class="clone-section-1-prop-section">
          <div class="clone-section-1-prop-row">
            <div class="clone-section-1-prop-bar clone-section-1-prop-bar-xs"></div>
            <div class="clone-section-1-prop-bar clone-section-1-prop-bar-md"></div>
            <div class="clone-section-1-prop-bar clone-section-1-prop-bar-sm"></div>
          </div>
          <div class="clone-section-1-prop-row">

        <div class="clone-section-1-divider"></div>

          <div class="clone-section-1-color-preview-row">

            <span class="clone-section-1-prop-icon" style="margin-left: auto;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="1"/>
                <circle cx="12" cy="5" r="1"/>
                <circle cx="12" cy="19" r="1"/>
              </svg>
            </span>
          </div>
          <div class="clone-section-1-prop-row">
            <div class="clone-section-1-prop-bar clone-section-1-prop-bar-lg"></div>
            <span class="clone-section-1-prop-icon" style="margin-left: auto;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="4" y1="21" x2="4" y2="14"/>
                <line x1="4" y1="10" x2="4" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12" y2="3"/>
                <line x1="20" y1="21" x2="20" y2="16"/>
                <line x1="20" y1="12" x2="20" y2="3"/>
              </svg>
            </span>
          </div>
        </div>
        <div class="clone-section-1-divider"></div>
        <div class="clone-section-1-prop-row">
          <div class="clone-section-1-prop-bar clone-section-1-prop-bar-md"></div>
          <span class="clone-section-1-add-icon" style="margin-left: auto;">+</span>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
