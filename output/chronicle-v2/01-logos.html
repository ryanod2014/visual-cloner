<style>
.chronicle-logos-section {
  background-color: #000000;
  padding: 0 0 80px 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
}

/* Feature Carousel Section */
.chronicle-logos-carousel-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

.chronicle-logos-carousel {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-bottom: 24px;
  overflow: hidden;
}

.chronicle-logos-card {
  width: 140px;
  height: 100px;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
}

.chronicle-logos-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.chronicle-logos-card-1 {
  background: linear-gradient(135deg, #4a6670 0%, #2d4a52 100%);
}

.chronicle-logos-card-2 {
  background: #c8e64a;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chronicle-logos-card-2 svg {
  width: 60px;
  height: 60px;
}

.chronicle-logos-card-3 {
  background: #f5f5f0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chronicle-logos-card-4 {
  background: #e8e8e8;
}

.chronicle-logos-card-5 {
  background: #1a1a1a;
}

.chronicle-logos-card-label {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(0, 0, 0, 0.6);
  color: #ffffff;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
}

/* Carousel Controls */
.chronicle-logos-carousel-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 40px;
}

.chronicle-logos-control-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: #1a1a1a;
  border: 1px solid #333333;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background-color 0.2s ease;
}

.chronicle-logos-control-btn:hover {
  background: #2a2a2a;
}

.chronicle-logos-control-btn svg {
  width: 16px;
  height: 16px;
  fill: #888888;
}

/* Category Tabs */
.chronicle-logos-tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 80px;
  padding: 0 20px;
}

.chronicle-logos-tab {
  color: #888888;
  font-size: 14px;
  padding: 8px 16px;
  cursor: pointer;
  transition: color 0.2s ease;
  border: none;
  background: transparent;
  position: relative;
}

.chronicle-logos-tab:hover {
  color: #ffffff;
}

.chronicle-logos-tab.chronicle-logos-tab-active {
  color: #ffffff;
}

.chronicle-logos-tab.chronicle-logos-tab-active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 2px;
  background: #c8e64a;
  border-radius: 1px;
}

/* Logo Bar Section */
.chronicle-logos-bar {
  text-align: center;
  padding: 0 20px;
}

.chronicle-logos-headline {
  color: #888888;
  font-size: 14px;
  font-weight: 400;
  margin-bottom: 40px;
  letter-spacing: 0.02em;
}

.chronicle-logos-grid {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 60px;
  flex-wrap: wrap;
  max-width: 900px;
  margin: 0 auto;
}

.chronicle-logos-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.7;
  transition: opacity 0.2s ease;
}

.chronicle-logos-logo:hover {
  opacity: 1;
}

.chronicle-logos-logo svg {
  height: 28px;
  width: auto;
  fill: #ffffff;
}

.chronicle-logos-logo-stanford svg {
  height: 36px;
}

.chronicle-logos-logo-tiktok svg {
  height: 32px;
}
</style>
