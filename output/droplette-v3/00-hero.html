<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Droplette - Hero</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0e0e0e;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hero-section {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Navigation */
    .hero-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 40px;
      position: relative;
      z-index: 10;
    }

    .hero-logo {
      width: 48px;
      height: 48px;
      position: relative;
    }

    .hero-logo-ring {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: conic-gradient(
        from 180deg,
        #ff00ff 0deg,
        #ff0080 45deg,
        #ff8000 90deg,
        #ffff00 135deg,
        #80ff00 180deg,
        #00ffff 225deg,
        #0080ff 270deg,
        #8000ff 315deg,
        #ff00ff 360deg
      );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-logo-inner {
      width: 30px;
      height: 30px;
      background: #0e0e0e;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      transform: rotate(180deg);
      position: relative;
      top: -2px;
    }

    .hero-cta-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      color: #0e0e0e;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .hero-cta-btn:hover {
      opacity: 0.9;
    }

    .hero-figma-icon {
      width: 18px;
      height: 18px;
    }

    /* Background grid of circles */
    .hero-bg-grid {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      overflow: hidden;
    }

    .hero-grid-row {
      display: flex;
      justify-content: space-around;
      padding: 0 20px;
    }

    .hero-grid-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      opacity: 0.6;
    }

    /* Grid rows positioning */
    .hero-grid-row-1 { position: absolute; top: 180px; left: 0; right: 0; }
    .hero-grid-row-2 { position: absolute; top: 280px; left: 0; right: 0; }
    .hero-grid-row-3 { position: absolute; top: 380px; left: 0; right: 0; }

    /* Main content */
    .hero-content {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 80px 20px 40px;
    }

    .hero-headline {
      font-size: clamp(42px, 6vw, 72px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-subheadline {
      font-size: 18px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.6);
      max-width: 600px;
      margin: 0 auto;
    }

    .hero-subheadline-highlight {
      color: white;
    }

    /* UI Mockups */
    .hero-mockups {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 24px;
      padding: 60px 40px 0;
      margin-top: 20px;
    }

    /* Rainbow glow behind center panel */
    .hero-glow {
      position: absolute;
      width: 500px;
      height: 400px;
      background: radial-gradient(ellipse at center,
        rgba(255, 100, 100, 0.3) 0%,
        rgba(255, 200, 100, 0.2) 20%,
        rgba(100, 255, 100, 0.2) 40%,
        rgba(100, 200, 255, 0.2) 60%,
        transparent 80%
      );
      top: 50%;
      left: 50%;
      transform: translate(-50%, -30%);
      filter: blur(60px);
      z-index: 1;
    }

    /* Side panels */
    .hero-side-panel {
      width: 280px;
      background: rgba(30, 30, 30, 0.9);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .hero-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .hero-panel-icon {
      width: 20px;
      height: 20px;
      opacity: 0.5;
    }

    .hero-panel-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .hero-panel-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .hero-panel-bar-short { width: 30px; }
    .hero-panel-bar-medium { width: 60px; }
    .hero-panel-bar-long { width: 100px; }

    .hero-panel-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }

    /* Center color palette panel */
    .hero-center-panel {
      width: 320px;
      background: rgba(40, 40, 40, 0.95);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: relative;
      z-index: 2;
    }

    .hero-center-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(30, 30, 30, 0.9);
    }

    .hero-droplette-icon {
      width: 16px;
      height: 16px;
      background: conic-gradient(
        from 180deg,
        #ff00ff,
        #ff8000,
        #ffff00,
        #00ff00,
        #00ffff,
        #0080ff,
        #ff00ff
      );
      border-radius: 50%;
    }

    .hero-center-title {
      font-size: 14px;
      font-weight: 500;
      color: white;
    }

    .hero-color-bars {
      display: flex;
      height: 350px;
    }

    .hero-color-bar {
      flex: 1;
    }

    .hero-color-bar-1 { background: linear-gradient(to bottom, #ff4400, #ff6622); }
    .hero-color-bar-2 { background: linear-gradient(to bottom, #ff6600, #ff8833); }
    .hero-color-bar-3 { background: linear-gradient(to bottom, #ffaa00, #ffcc33); }
    .hero-color-bar-4 { background: linear-gradient(to bottom, #ccff00, #ddff33); }
    .hero-color-bar-5 { background: linear-gradient(to bottom, #88ff00, #aaff33); }
    .hero-color-bar-6 { background: linear-gradient(to bottom, #00ffcc, #33ffdd); }
    .hero-color-bar-7 { background: linear-gradient(to bottom, #00ccff, #33ddff); }
    .hero-color-bar-8 { background: linear-gradient(to bottom, #0088ff, #33aaff); }
    .hero-color-bar-9 { background: linear-gradient(to bottom, #cc00ff, #dd33ff); }
    .hero-color-bar-10 { background: linear-gradient(to bottom, #ff00cc, #ff33dd); }

    /* Right panel specific */
    .hero-right-panel {
      width: 300px;
    }

    .hero-right-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .hero-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: white;
    }

    .hero-right-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hero-play-btn {
      width: 0;
      height: 0;
      border-left: 8px solid rgba(255, 255, 255, 0.4);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }

    .hero-toggle {
      width: 44px;
      height: 24px;
      background: #3b82f6;
      border-radius: 12px;
      position: relative;
    }

    .hero-toggle::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      top: 3px;
      right: 3px;
    }

    .hero-right-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 4px 0;
    }

    .hero-right-icon {
      width: 16px;
      height: 16px;
      opacity: 0.4;
    }

    .hero-slider-track {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      position: relative;
    }

    .hero-slider-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }

    .hero-color-preview {
      display: flex;
      gap: 4px;
    }

    .hero-color-dot {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    /* Left panel icons */
    .hero-grid-icon {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px;
      width: 16px;
      height: 16px;
    }

    .hero-grid-icon span {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 1px;
    }

    .hero-sidebar-icon {
      display: flex;
      gap: 2px;
      width: 16px;
      height: 16px;
    }

    .hero-sidebar-icon span:first-child {
      width: 5px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 1px;
    }

    .hero-sidebar-icon span:last-child {
      flex: 1;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 1px;
    }

    .hero-search-icon {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      position: relative;
    }

    .hero-search-icon::after {
      content: '';
      position: absolute;
      width: 5px;
      height: 2px;
      background: rgba(255, 255, 255, 0.4);
      bottom: -1px;
      right: -3px;
      transform: rotate(45deg);
    }

    .hero-plus-icon {
      width: 14px;
      height: 14px;
      position: relative;
    }

    .hero-plus-icon::before,
    .hero-plus-icon::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
    }

    .hero-plus-icon::before {
      width: 14px;
      height: 2px;
      top: 6px;
      left: 0;
    }

    .hero-plus-icon::after {
      width: 2px;
      height: 14px;
      left: 6px;
      top: 0;
    }

    /* Dropdown arrow */
    .hero-dropdown {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .hero-arrow-down {
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 4px solid rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <section class="hero-section">
    <!-- Background Grid of Circles -->
    <div class="hero-bg-grid">
      <!-- Row 1 -->
      <div class="hero-grid-row hero-grid-row-1">
        <div class="hero-grid-circle" style="background: #2a4a5a; opacity: 0.4;"></div>
        <div class="hero-grid-circle" style="background: #3a3a4a; opacity: 0.3;"></div>
        <div class="hero-grid-circle" style="background: #4a3a5a; opacity: 0.3;"></div>
        <div class="hero-grid-circle" style="background: #5a2a6a; opacity: 0.4;"></div>
        <div class="hero-grid-circle" style="background: #6a3a3a; opacity: 0.5;"></div>
        <div class="hero-grid-circle" style="background: #7a5a2a; opacity: 0.5;"></div>
        <div class="hero-grid-circle" style="background: #6a6a2a; opacity: 0.4;"></div>
        <div class="hero-grid-circle" style="background: #4a7a3a; opacity: 0.4;"></div>
        <div class="hero-grid-circle" style="background: #3a6a5a; opacity: 0.3;"></div>
        <div class="hero-grid-circle" style="background: #2a5a6a; opacity: 0.4;"></div>
      </div>
      <!-- Row 2 -->
      <div class="hero-grid-row hero-grid-row-2">
        <div class="hero-grid-circle" style="background: #1a3a4a; opacity: 0.3;"></div>
        <div class="hero-grid-circle" style="background: #2a2a3a; opacity: 0.2;"></div>
        <div class="hero-grid-circle" style="background: #3a2a4a; opacity: 0.2;"></div>
        <div class="hero-grid-circle" style="background: #4a1a5a; opacity: 0.3;"></div>
        <div class="hero-grid-circle" style="background: #5a2a2a; opacity: 0.4;"></div>
        <div class="hero-grid-circle" style="background: #6a4a1a; opacity: 0.4;"></div>
        <div class="hero-grid-circle" style="background: #5a5a1a; opacity: 0.3;"></div>
        <div class="hero-grid-circle" style="background: #3a6a2a; opacity: 0.3;"></div>
        <div class="hero-grid-circle" style="background: #2a5a4a; opacity: 0.2;"></div>
        <div class="hero-grid-circle" style="background: #1a4a5a; opacity: 0.3;"></div>
      </div>
      <!-- Row 3 -->
      <div class="hero-grid-row hero-grid-row-3">
        <div class="hero-grid-circle" style="background: #1a2a3a; opacity: 0.2;"></div>
        <div class="hero-grid-circle" style="background: #2a1a2a; opacity: 0.15;"></div>
        <div class="hero-grid-circle" style="background: #3a1a3a; opacity: 0.15;"></div>
        <div class="hero-grid-circle" style="background: #4a0a4a; opacity: 0.2;"></div>
        <div class="hero-grid-circle" style="background: #5a1a1a; opacity: 0.3;"></div>
        <div class="hero-grid-circle" style="background: #6a3a0a; opacity: 0.3;"></div>
        <div class="hero-grid-circle" style="background: #5a5a0a; opacity: 0.25;"></div>
        <div class="hero-grid-circle" style="background: #3a6a1a; opacity: 0.25;"></div>
        <div class="hero-grid-circle" style="background: #2a5a3a; opacity: 0.2;"></div>
        <div class="hero-grid-circle" style="background: #1a4a4a; opacity: 0.25;"></div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="hero-nav">
      <div class="hero-logo">
        <div class="hero-logo-ring">
          <div class="hero-logo-inner"></div>
        </div>
      </div>
      <button class="hero-cta-btn">
        <svg class="hero-figma-icon" viewBox="0 0 24 24" fill="none">
          <path d="M8 24C10.208 24 12 22.208 12 20V16H8C5.792 16 4 17.792 4 20C4 22.208 5.792 24 8 24Z" fill="#0ACF83"/>
          <path d="M4 12C4 9.792 5.792 8 8 8H12V16H8C5.792 16 4 14.208 4 12Z" fill="#A259FF"/>
          <path d="M4 4C4 1.792 5.792 0 8 0H12V8H8C5.792 8 4 6.208 4 4Z" fill="#F24E1E"/>
          <path d="M12 0H16C18.208 0 20 1.792 20 4C20 6.208 18.208 8 16 8H12V0Z" fill="#FF7262"/>
          <path d="M20 12C20 14.208 18.208 16 16 16C13.792 16 12 14.208 12 12C12 9.792 13.792 8 16 8C18.208 8 20 9.792 20 12Z" fill="#1ABCFE"/>
        </svg>
        Try in Figma
      </button>
    </nav>

    <!-- Main Content -->
    <div class="hero-content">
      <h1 class="hero-headline">An AI tool made to<br>enhance designers.</h1>
      <p class="hero-subheadline">
        Create palettes in Figma & FigJam based on your color styles<br>
        easily with <span class="hero-subheadline-highlight">Droplette, AI that works for you.</span>
      </p>
    </div>

    <!-- UI Mockups -->
    <div class="hero-mockups">
      <div class="hero-glow"></div>

      <!-- Left Panel -->
      <div class="hero-side-panel">
        <div class="hero-panel-header">
          <div class="hero-dropdown">
            <div class="hero-grid-icon">
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="hero-arrow-down"></div>
          </div>
          <div class="hero-sidebar-icon">
            <span></span><span></span>
          </div>
        </div>
        <div class="hero-panel-row">
          <div class="hero-arrow-down"></div>
          <div class="hero-panel-bar hero-panel-bar-long"></div>
        </div>
        <div class="hero-panel-row">
          <div class="hero-panel-bar hero-panel-bar-medium" style="margin-left: 16px;"></div>
        </div>
        <div class="hero-panel-row">
          <div class="hero-panel-bar hero-panel-bar-short"></div>
          <div class="hero-panel-bar hero-panel-bar-short"></div>
          <div style="flex: 1;"></div>
          <div class="hero-search-icon"></div>
        </div>
        <div class="hero-panel-row">
          <div class="hero-arrow-down"></div>
          <div class="hero-panel-bar hero-panel-bar-medium"></div>
          <div style="flex: 1;"></div>
          <div class="hero-plus-icon"></div>
        </div>
        <div class="hero-panel-row">
          <div class="hero-arrow-down"></div>
          <div class="hero-panel-bar hero-panel-bar-long"></div>
        </div>
      </div>

      <!-- Center Panel - Color Palette -->
      <div class="hero-center-panel">
        <div class="hero-center-header">
          <div class="hero-droplette-icon"></div>
          <span class="hero-center-title">Droplette</span>
        </div>
        <div class="hero-color-bars">
          <div class="hero-color-bar hero-color-bar-1"></div>
          <div class="hero-color-bar hero-color-bar-2"></div>
          <div class="hero-color-bar hero-color-bar-3"></div>
          <div class="hero-color-bar hero-color-bar-4"></div>
          <div class="hero-color-bar hero-color-bar-5"></div>
          <div class="hero-color-bar hero-color-bar-6"></div>
          <div class="hero-color-bar hero-color-bar-7"></div>
          <div class="hero-color-bar hero-color-bar-8"></div>
          <div class="hero-color-bar hero-color-bar-9"></div>
          <div class="hero-color-bar hero-color-bar-10"></div>
        </div>
      </div>

      <!-- Right Panel -->
      <div class="hero-side-panel hero-right-panel">
        <div class="hero-right-header">
          <div class="hero-dropdown">
            <div class="hero-avatar">S</div>
            <div class="hero-arrow-down"></div>
          </div>
          <div class="hero-right-controls">
            <div class="hero-play-btn"></div>
            <div class="hero-arrow-down"></div>
            <div class="hero-toggle"></div>
          </div>
        </div>
        <div class="hero-right-row">
          <div class="hero-panel-bar hero-panel-bar-short"></div>
          <div class="hero-panel-bar hero-panel-bar-long"></div>
          <div class="hero-panel-bar hero-panel-bar-medium"></div>
          <div class="hero-arrow-down"></div>
        </div>
        <div class="hero-right-row">
          <div class="hero-panel-bar hero-panel-bar-medium"></div>
          <div style="flex: 1;"></div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="opacity: 0.4;">
            <circle cx="12" cy="12" r="3" stroke="white" stroke-width="2"/>
            <path d="M12 5V3M12 21v-2M5 12H3m18 0h-2" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="hero-right-row">
          <div class="hero-panel-bar hero-panel-bar-short"></div>
          <div class="hero-slider-track" style="width: 80px;">
            <div class="hero-slider-fill" style="width: 40%;"></div>
          </div>
          <div class="hero-color-preview">
            <div class="hero-color-dot" style="background: #ff6b35;"></div>
            <div class="hero-color-dot" style="background: #f7931e;"></div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="opacity: 0.4;">
            <circle cx="12" cy="12" r="10" stroke="white" stroke-width="2"/>
            <circle cx="12" cy="12" r="4" fill="white"/>
          </svg>
        </div>
        <div class="hero-right-row">
          <div class="hero-panel-bar" style="width: 140px;"></div>
          <div style="flex: 1;"></div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="opacity: 0.4;">
            <path d="M12 6V4m0 16v-2M6 12H4m16 0h-2M7.05 7.05L5.636 5.636m12.728 12.728l-1.414-1.414M7.05 16.95l-1.414 1.414m12.728-12.728l-1.414 1.414" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="hero-right-row">
          <div class="hero-panel-bar" style="width: 100px;"></div>
          <div style="flex: 1;"></div>
          <div class="hero-plus-icon"></div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
