<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Section</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0e0e0e;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .pricing-section {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 80px 24px;
    }

    .pricing-container {
      background-color: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 120px 80px;
      max-width: 1200px;
      width: 100%;
      text-align: center;
    }

    .pricing-headline {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 32px;
    }

    .pricing-headline-line {
      display: block;
    }

    .pricing-subtitle {
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 40px;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }

    .pricing-highlight {
      color: #ffffff;
      font-weight: 500;
    }

    .pricing-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pricing-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .pricing-btn-primary {
      background-color: #ffffff;
      color: #0e0e0e;
    }

    .pricing-btn-primary:hover {
      background-color: #f0f0f0;
    }

    .pricing-btn-secondary {
      background-color: #262626;
      color: #ffffff;
      border: 1px solid #3a3a3a;
    }

    .pricing-btn-secondary:hover {
      background-color: #333333;
    }

    .pricing-price-current {
      font-weight: 500;
    }

    .pricing-price-old {
      color: rgba(14, 14, 14, 0.5);
      text-decoration: line-through;
      margin-left: 4px;
    }

    .pricing-figma-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pricing-figma-icon svg {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      .pricing-container {
        padding: 60px 32px;
      }

      .pricing-headline {
        font-size: 40px;
      }

      .pricing-subtitle {
        font-size: 16px;
      }

      .pricing-buttons {
        flex-direction: column;
      }

      .pricing-btn {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <section class="pricing-section">
    <div class="pricing-container">
      <h2 class="pricing-headline">
        <span class="pricing-headline-line">One price.</span>
        <span class="pricing-headline-line">No subscription.</span>
      </h2>
      <p class="pricing-subtitle">
        Simple pricing with no hidden fees. Pay once and own it forever. <span class="pricing-highlight">Special introductory offer.</span>
      </p>
      <div class="pricing-buttons">
        <a href="#" class="pricing-btn pricing-btn-primary">
          <span class="pricing-price-current">Get Started</span>
        </a>
        <a href="#" class="pricing-btn pricing-btn-secondary">
          <span class="pricing-figma-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 24C10.208 24 12 22.208 12 20V16H8C5.792 16 4 17.792 4 20C4 22.208 5.792 24 8 24Z" fill="#0ACF83"/>
              <path d="M4 12C4 9.792 5.792 8 8 8H12V16H8C5.792 16 4 14.208 4 12Z" fill="#A259FF"/>
              <path d="M4 4C4 1.792 5.792 0 8 0H12V8H8C5.792 8 4 6.208 4 4Z" fill="#F24E1E"/>
              <path d="M12 0H16C18.208 0 20 1.792 20 4C20 6.208 18.208 8 16 8H12V0Z" fill="#FF7262"/>
              <path d="M20 12C20 14.208 18.208 16 16 16C13.792 16 12 14.208 12 12C12 9.792 13.792 8 16 8C18.208 8 20 9.792 20 12Z" fill="#1ABCFE"/>
            </svg>
          </span>
          <span>Learn More</span>
        </a>
      </div>
    </div>
  </section>
</body>
</html>
