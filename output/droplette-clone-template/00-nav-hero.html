<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme - Nav Hero</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0e0e0e;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .nav-hero-section {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Navigation */
    .nav-hero-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 40px;
      position: relative;
      z-index: 100;
    }

    .nav-hero-logo {
      width: 48px;
      height: 48px;
      position: relative;
    }

    .nav-hero-logo-droplet {
      width: 48px;
      height: 48px;
      position: relative;
    }

    .nav-hero-logo-droplet::before {
      content: '';
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: conic-gradient(
        from 180deg at 50% 50%,
        #ff6b9d 0deg,
        #ffd93d 60deg,
        #6bcb77 120deg,
        #4d96ff 180deg,
        #9b59b6 240deg,
        #ff6b9d 360deg
      );
    }

    .nav-hero-logo-droplet::after {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-45deg);
      background: #0e0e0e;
      border-radius: 50% 50% 50% 0;
    }

    .nav-hero-cta-button {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #0e0e0e;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .nav-hero-cta-button:hover {
      opacity: 0.9;
    }

    .nav-hero-figma-icon {
      width: 18px;
      height: 18px;
    }

    .nav-hero-figma-icon svg {
      width: 100%;
      height: 100%;
    }

    /* Hero Content */
    .nav-hero-content {
      text-align: center;
      padding: 60px 40px 40px;
      position: relative;
      z-index: 10;
    }

    .nav-hero-headline {
      font-size: 69px;
      font-weight: 500;
      font-style: italic;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .nav-hero-subtitle {
      font-size: 18px;
      line-height: 1.6;
      color: #9a9a9a;
      max-width: 560px;
      margin: 0 auto;
    }

    .nav-hero-subtitle strong {
      color: #ffffff;
      font-weight: 500;
    }

    /* Color Dots Background */
    .nav-hero-dots-container {
      position: absolute;
      top: 80px;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1;
    }

    .nav-hero-dots-row {
      display: flex;
      justify-content: space-around;
      padding: 0 20px;
      margin-bottom: 80px;
    }

    .nav-hero-dot {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      opacity: 0.8;
    }

    /* Row 1 dots */
    .nav-hero-dot-1 { background: #00d4d4; }
    .nav-hero-dot-2 { background: #4a9eff; }
    .nav-hero-dot-3 { background: #9b6b9e; }
    .nav-hero-dot-4 { background: #8b7355; }
    .nav-hero-dot-5 { background: #ff6b35; }
    .nav-hero-dot-6 { background: #ffd93d; }
    .nav-hero-dot-7 { background: #c4a574; }
    .nav-hero-dot-8 { background: #8fbc8f; }
    .nav-hero-dot-9 { background: #5588aa; }
    .nav-hero-dot-10 { background: #3d7a99; }

    /* Row 2 dots */
    .nav-hero-dot-11 { background: #00b8b8; }
    .nav-hero-dot-12 { background: #3388dd; }
    .nav-hero-dot-13 { background: #4488cc; }
    .nav-hero-dot-14 { background: #cc6644; }
    .nav-hero-dot-15 { background: #ff5533; }
    .nav-hero-dot-16 { background: #ddaa44; }
    .nav-hero-dot-17 { background: #c4a070; }
    .nav-hero-dot-18 { background: #a8a878; }
    .nav-hero-dot-19 { background: #88aa66; }
    .nav-hero-dot-20 { background: #5599aa; }

    /* Product Showcase */
    .nav-hero-showcase {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      padding: 60px 40px 0;
      margin-top: 40px;
    }

    /* Left Panel - Figma sidebar */
    .nav-hero-panel-left {
      width: 280px;
      background: #2c2c2c;
      border-radius: 12px;
      padding: 16px;
      flex-shrink: 0;
    }

    .nav-hero-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .nav-hero-panel-icon {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #888;
    }

    .nav-hero-panel-icon svg {
      width: 16px;
      height: 16px;
    }

    .nav-hero-panel-action {
      width: 24px;
      height: 24px;
      background: transparent;
      border: 1px solid #444;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-hero-panel-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
    }

    .nav-hero-panel-chevron {
      width: 12px;
      height: 12px;
      color: #666;
    }

    .nav-hero-panel-bar {
      height: 8px;
      background: #555;
      border-radius: 4px;
    }

    .nav-hero-panel-bar-long { width: 80px; }
    .nav-hero-panel-bar-short { width: 40px; }
    .nav-hero-panel-bar-medium { width: 60px; }

    .nav-hero-panel-row-spaced {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .nav-hero-panel-bars-group {
      display: flex;
      gap: 8px;
    }

    .nav-hero-search-icon,
    .nav-hero-plus-icon {
      width: 16px;
      height: 16px;
      color: #666;
    }

    /* Center Panel - Acme palette */
    .nav-hero-panel-center {
      width: 320px;
      background: #3a3a3a;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .nav-hero-palette-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: #3a3a3a;
    }

    .nav-hero-palette-logo {
      width: 16px;
      height: 16px;
      position: relative;
    }

    .nav-hero-palette-logo::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: conic-gradient(
        from 180deg at 50% 50%,
        #ff6b9d 0deg,
        #ffd93d 60deg,
        #6bcb77 120deg,
        #4d96ff 180deg,
        #9b59b6 240deg,
        #ff6b9d 360deg
      );
    }

    .nav-hero-palette-title {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }

    .nav-hero-palette-colors {
      display: flex;
      height: 420px;
    }

    .nav-hero-color-strip {
      flex: 1;
    }

    .nav-hero-color-red { background: linear-gradient(to bottom, #ff4444, #cc2222); }
    .nav-hero-color-orange { background: linear-gradient(to bottom, #ff8844, #ee6622); }
    .nav-hero-color-yellow { background: linear-gradient(to bottom, #ffcc00, #eebb00); }
    .nav-hero-color-lime { background: linear-gradient(to bottom, #aadd00, #99cc00); }
    .nav-hero-color-green { background: linear-gradient(to bottom, #44dd88, #33cc77); }
    .nav-hero-color-cyan { background: linear-gradient(to bottom, #44dddd, #33cccc); }
    .nav-hero-color-blue { background: linear-gradient(to bottom, #4499ff, #3388ee); }
    .nav-hero-color-purple { background: linear-gradient(to bottom, #aa44ff, #9933ee); }
    .nav-hero-color-magenta { background: linear-gradient(to bottom, #dd44aa, #cc3399); }

    /* Right Panel - Figma properties */
    .nav-hero-panel-right {
      width: 280px;
      background: #2c2c2c;
      border-radius: 12px;
      padding: 16px;
      flex-shrink: 0;
    }

    .nav-hero-panel-right-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .nav-hero-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b35, #cc4422);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: white;
    }

    .nav-hero-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-hero-play-btn {
      width: 24px;
      height: 24px;
      color: #888;
    }

    .nav-hero-share-btn {
      background: #4a9eff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    .nav-hero-prop-section {
      margin-bottom: 16px;
    }

    .nav-hero-prop-row {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }

    .nav-hero-prop-bar {
      height: 8px;
      background: #555;
      border-radius: 4px;
    }

    .nav-hero-prop-bar-1 { width: 60px; }
    .nav-hero-prop-bar-2 { width: 80px; }
    .nav-hero-prop-bar-3 { width: 100px; }

    .nav-hero-prop-row-icons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .nav-hero-prop-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav-hero-prop-checkbox {
      width: 16px;
      height: 16px;
      border: 1px solid #555;
      border-radius: 3px;
      background: transparent;
    }

    .nav-hero-prop-input {
      height: 8px;
      background: #555;
      border-radius: 4px;
    }

    .nav-hero-prop-input-wide { width: 120px; }
    .nav-hero-prop-input-narrow { width: 40px; }

    .nav-hero-prop-icon {
      width: 16px;
      height: 16px;
      color: #666;
    }

    .nav-hero-divider {
      height: 1px;
      background: #444;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <section class="nav-hero-section">
    <!-- Background Dots -->
    <div class="nav-hero-dots-container">
      <div class="nav-hero-dots-row" style="margin-top: 100px;">
        <div class="nav-hero-dot nav-hero-dot-1"></div>
        <div class="nav-hero-dot nav-hero-dot-2"></div>
        <div class="nav-hero-dot nav-hero-dot-3"></div>
        <div class="nav-hero-dot nav-hero-dot-4"></div>
        <div class="nav-hero-dot nav-hero-dot-5"></div>
        <div class="nav-hero-dot nav-hero-dot-6"></div>
        <div class="nav-hero-dot nav-hero-dot-7"></div>
        <div class="nav-hero-dot nav-hero-dot-8"></div>
        <div class="nav-hero-dot nav-hero-dot-9"></div>
        <div class="nav-hero-dot nav-hero-dot-10"></div>
      </div>
      <div class="nav-hero-dots-row" style="margin-top: 140px;">
        <div class="nav-hero-dot nav-hero-dot-11"></div>

        <div class="nav-hero-dot nav-hero-dot-13"></div>
        <div class="nav-hero-dot nav-hero-dot-14"></div>

        <div class="nav-hero-dot nav-hero-dot-19"></div>
        <div class="nav-hero-dot nav-hero-dot-20"></div>

    </div>

    <!-- Navigation -->
    <nav class="nav-hero-nav">
      <div class="nav-hero-logo">
        <div class="nav-hero-logo-droplet"></div>
      </div>
      <button class="nav-hero-cta-button">
        <span class="nav-hero-figma-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 24C10.208 24 12 22.208 12 20V16H8C5.792 16 4 17.792 4 20C4 22.208 5.792 24 8 24Z" fill="#0ACF83"/>
            <path d="M4 12C4 9.792 5.792 8 8 8H12V16H8C5.792 16 4 14.208 4 12Z" fill="#A259FF"/>

            <path d="M12 0H16C18.208 0 20 1.792 20 4C20 6.208 18.208 8 16 8H12V0Z" fill="#FF7262"/>
            <path d="M20 12C20 14.208 18.208 16 16 16C13.792 16 12 14.208 12 12C12 9.792 13.792 8 16 8C18.208 8 20 9.792 20 12Z" fill="#1ABCFE"/>
          </svg>

      </button>
    </nav>

    <div class="nav-hero-content">

      <p class="nav-hero-subtitle">
        Create beautiful designs easily & FigJam based on your color styles<br>
        easily with <strong>Acme, AI that works for you.</strong>
      </p>
    </div>

    <!-- Product Showcase -->
    <div class="nav-hero-showcase">
      <!-- Left Panel -->
      <div class="nav-hero-panel-left">
        <div class="nav-hero-panel-header">
          <div class="nav-hero-panel-icon">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <rect x="2" y="2" width="4" height="4" rx="1"/>
              <rect x="2" y="10" width="4" height="4" rx="1"/>
              <rect x="10" y="2" width="4" height="4" rx="1"/>
              <rect x="10" y="10" width="4" height="4" rx="1"/>
            </svg>
          </div>
          <div class="nav-hero-panel-action">

              <rect x="1" y="1" width="10" height="10" rx="1"/>
              <line x1="6" y1="1" x2="6" y2="11"/>

          </div>
        </div>

        <div class="nav-hero-panel-row">
          <svg class="nav-hero-panel-chevron" viewBox="0 0 12 12" fill="currentColor">
            <path d="M4 2L8 6L4 10" stroke="#666" stroke-width="1.5" fill="none"/>
          </svg>

        <div class="nav-hero-panel-row">
          <svg class="nav-hero-panel-chevron" viewBox="0 0 12 12" fill="currentColor">

            <line x1="8" y1="2" x2="8" y2="14"/>

          </svg>
        </div>

        <div class="nav-hero-panel-row">
          <svg class="nav-hero-panel-chevron" viewBox="0 0 12 12" fill="currentColor">
            <path d="M4 2L8 6L4 10" stroke="#666" stroke-width="1.5" fill="none"/>
          </svg>
          <div class="nav-hero-panel-bar nav-hero-panel-bar-short"></div>
        </div>
      </div>

      <!-- Center Panel - Acme -->

        <div class="nav-hero-palette-header">

          <div class="nav-hero-avatar">S</div>
          <div class="nav-hero-header-actions">
            <svg class="nav-hero-play-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <polygon points="5,3 19,12 5,21" fill="none"/>
            </svg>
            <button class="nav-hero-share-btn">Share</button>
          </div>
        </div>

        <div class="nav-hero-prop-section">
          <div class="nav-hero-prop-row">
            <div class="nav-hero-prop-bar nav-hero-prop-bar-1"></div>
            <div class="nav-hero-prop-bar nav-hero-prop-bar-2"></div>
            <div class="nav-hero-prop-bar nav-hero-prop-bar-1"></div>
          </div>
          <div class="nav-hero-prop-row">
            <div class="nav-hero-prop-bar nav-hero-prop-bar-1"></div>
            <div class="nav-hero-prop-bar nav-hero-prop-bar-3"></div>
            <div class="nav-hero-prop-bar nav-hero-prop-bar-1"></div>
          </div>
        </div>

        <div class="nav-hero-prop-row-icons">
          <div class="nav-hero-prop-inputs">
            <div class="nav-hero-prop-checkbox"></div>
            <div class="nav-hero-prop-input nav-hero-prop-input-wide"></div>

          <svg class="nav-hero-prop-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">

        <div class="nav-hero-prop-row-icons">

        <div class="nav-hero-prop-row-icons">
          <div class="nav-hero-prop-bar nav-hero-prop-bar-2"></div>
          <svg class="nav-hero-prop-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="8" y1="2" x2="8" y2="14"/>
            <line x1="2" y1="8" x2="14" y2="8"/>
          </svg>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
