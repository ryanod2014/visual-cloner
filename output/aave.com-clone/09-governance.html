<style>
.aave-governance-section {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background-color: #ffffff;
  color: #1a1a2e;
  padding: 0;
  margin: 0;
  line-height: 1.5;
}

.aave-governance-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 40px;
  background: #ffffff;
}

.aave-governance-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 22px;
  font-weight: 700;
  color: #1a1a2e;
  text-decoration: none;
}

.aave-governance-logo-icon {
  width: 32px;
  height: 20px;
}

.aave-governance-nav {
  display: flex;
  align-items: center;
  gap: 40px;
}

.aave-governance-nav-link {
  font-size: 15px;
  font-weight: 500;
  color: #1a1a2e;
  text-decoration: none;
  position: relative;
  transition: color 0.2s ease;
}

.aave-governance-nav-link:hover {
  color: #2ebac6;
}

.aave-governance-nav-link.aave-governance-has-indicator::after {
  content: '';
  position: absolute;
  top: -2px;
  right: -8px;
  width: 6px;
  height: 6px;
  background: #2ebac6;
  border-radius: 50%;
}

.aave-governance-cta-btn {
  background: #1a1a2e;
  color: #ffffff;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  transition: background 0.2s ease, transform 0.2s ease;
}

.aave-governance-cta-btn:hover {
  background: #2d2d4a;
  transform: translateY(-1px);
}

.aave-governance-main {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 24px;
  padding: 0 40px 60px;
  max-width: 1200px;
  margin: 0 auto;
}

.aave-governance-illustration {
  background: linear-gradient(135deg, #f8f9fa 0%, #f0f4f8 100%);
  border-radius: 24px;
  padding: 60px;

  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  min-height: 420px;
}

  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.aave-governance-ghost {
  position: relative;
  z-index: 2;
}

.aave-governance-ghost svg {
  width: 180px;
  height: 180px;
}

.aave-governance-circle {

  border-radius: 50%;

}

.aave-governance-stat-card {

.aave-governance-stat-header {

.aave-governance-stat-label {

.aave-governance-stat-period {

.aave-governance-stat-period::before {

.aave-governance-gauge-container {
  display: flex;
  justify-content: center;
  padding: 20px 0;

.aave-governance-gauge {
