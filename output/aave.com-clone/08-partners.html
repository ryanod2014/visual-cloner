}

/* 5 Years Strong Section */
.aave-partners-five-years {

  gap: 24px;

  margin: 0 auto;
  padding: 80px 48px;
}

.aave-partners-five-years-content {

  padding: 48px;

  flex-direction: column;
  justify-content: center;
}

.aave-partners-five-years-title {
  font-size: 32px;
  font-weight: 600;
  color: #1a1a1a;
  margin: 0 0 24px 0;
  line-height: 1.2;
}

.aave-partners-divider {

  height: 1px;
  background-color: #e0e0e0;
  margin-bottom: 24px;
}

.aave-partners-five-years-text {

  line-height: 1.6;

}

.aave-partners-link {

  color: #1a1a1a;

  border-bottom: 2px solid #1a1a1a;

  width: fit-content;
  transition: opacity 0.2s ease;
}

.aave-partners-link:hover {
  opacity: 0.7;
}

.aave-partners-link-arrow {
  font-size: 14px;
}

.aave-partners-five-years-graphic {
  background-color: #f5f5f5;
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
  min-height: 280px;
}

.aave-partners-circles {
  display: flex;
  align-items: center;
  gap: -20px;
}

.aave-partners-circle {
  border-radius: 50%;
  flex-shrink: 0;
}

.aave-partners-circle-1 {
  width: 24px;
  height: 24px;
  background: linear-gradient(135deg, #2ebac6 0%, #1a9ba5 100%);
  margin-right: -8px;
  z-index: 1;
}

.aave-partners-circle-2 {
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, #2ebac6 0%, #1a9ba5 100%);
  margin-right: -12px;
  z-index: 2;
}

.aave-partners-circle-3 {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, #2ebac6 0%, #1a9ba5 100%);
  margin-right: -20px;
  z-index: 3;
}

.aave-partners-circle-4 {
  width: 120px;
  height: 120px;
  background: linear-gradient(135deg, #2ebac6 0%, #1a9ba5 100%);
  margin-right: -30px;
  z-index: 4;
}

.aave-partners-circle-5 {
  width: 160px;
  height: 160px;
  background: linear-gradient(135deg, #2ebac6 0%, #1a9ba5 100%);
  z-index: 5;
}

/* GHO Section */
.aave-partners-gho {
  max-width: 1200px;
  margin: 0 auto;
  padding: 80px 48px 120px;
}

.aave-partners-gho-title {
  font-size: 64px;
  font-weight: 700;
  color: #1a1a1a;
  margin: 0 0 24px 0;
  letter-spacing: -0.02em;
}

.aave-partners-gho-text {
  font-size: 20px;
  color: #666666;
  line-height: 1.5;
  margin: 0 0 24px 0;
  max-width: 600px;
}

/* Responsive */
@media (max-width: 768px) {
  .aave-partners-five-years {
    grid-template-columns: 1fr;
    padding: 40px 24px;
  }

  .aave-partners-five-years-content {
    padding: 32px;
  }

  .aave-partners-five-years-title {
    font-size: 26px;
  }

  .aave-partners-five-years-text {
    font-size: 16px;
  }

  .aave-partners-five-years-graphic {
    padding: 32px;
    min-height: 200px;
  }

  .aave-partners-circle-1 {
    width: 16px;
    height: 16px;
  }

  .aave-partners-circle-2 {
    width: 32px;
    height: 32px;
  }

  .aave-partners-circle-3 {

  }
}
