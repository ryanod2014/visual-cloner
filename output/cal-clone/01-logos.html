<!-- Section: cal-logos -->
<section id="cal-logos" class="cal-logos-section">
  <style>
    .cal-logos-section {
      background: #ffffff;
      padding: 40px 0 60px 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .cal-logos-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .cal-logos-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .cal-logos-text {
      flex-shrink: 0;
      max-width: 180px;
    }

    .cal-logos-text p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: #6b7280;
    }

    .cal-logos-grid {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 48px;
      flex-wrap: wrap;
      flex: 1;
    }

    .cal-logos-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: #000000;
      text-decoration: none;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .cal-logos-logo-supabase {
      font-size: 20px;
    }

    .cal-logos-logo-supabase::before {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #3ecf8e 50%, #1a1a1a 50%);
      transform: rotate(-45deg);
      margin-right: 4px;
    }

    .cal-logos-logo-rio {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .cal-logos-logo-deel {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .cal-logos-logo-deel span {
      display: inline-block;
    }

    .cal-logos-logo-framer {
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cal-logos-framer-icon {
      width: 18px;
      height: 18px;
      position: relative;
    }

    .cal-logos-framer-icon::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 9px solid #000;
    }

    .cal-logos-framer-icon::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 18px;
      height: 9px;
      background: #000;
    }

    .cal-logos-logo-ramp {
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .cal-logos-ramp-arrow {
      display: inline-block;
      width: 20px;
      height: 16px;
      position: relative;
      margin-left: 2px;
    }

    .cal-logos-ramp-arrow::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 14px;
      height: 2px;
      background: #84cc16;
      transform: translateY(-50%);
    }

    .cal-logos-ramp-arrow::after {
      content: '';
      position: absolute;
      top: 50%;
      right: 2px;
      width: 8px;
      height: 8px;
      border-top: 2px solid #84cc16;
      border-right: 2px solid #84cc16;
      transform: translateY(-50%) rotate(45deg);
    }

    .cal-logos-logo-planetscale {
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cal-logos-planetscale-icon {
      width: 24px;
      height: 24px;
      position: relative;
    }

    .cal-logos-planetscale-icon svg {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 1024px) {
      .cal-logos-content {
        flex-direction: column;
        text-align: center;
        gap: 32px;
      }

      .cal-logos-text {
        max-width: 100%;
      }

      .cal-logos-grid {
        justify-content: center;
        gap: 32px;
      }
    }

    @media (max-width: 640px) {
      .cal-logos-grid {
        gap: 24px;
      }

      .cal-logos-logo {
        font-size: 16px;
      }
    }
  </style>

  <div class="cal-logos-container">
    <div class="cal-logos-content">
      <div class="cal-logos-text">
        <p>Trusted by fast-growing companies around the world</p>
      </div>
      <div class="cal-logos-grid">
        <!-- Supabase -->
        <div class="cal-logos-logo cal-logos-logo-supabase">
          <svg width="20" height="20" viewBox="0 0 109 113" fill="none">
            <path d="M63.7076 110.284C60.8481 113.885 55.0502 111.912 54.9813 107.314L53.9738 40.0627H99.1935C107.384 40.0627 111.952 49.5228 106.859 55.9374L63.7076 110.284Z" fill="url(#paint0_linear)"/>
            <path d="M63.7076 110.284C60.8481 113.885 55.0502 111.912 54.9813 107.314L53.9738 40.0627H99.1935C107.384 40.0627 111.952 49.5228 106.859 55.9374L63.7076 110.284Z" fill="url(#paint1_linear)" fill-opacity="0.2"/>
            <path d="M45.317 2.07103C48.1765 -1.53037 53.9745 0.442937 54.0434 5.041L54.4849 72.2922H9.83113C1.64038 72.2922 -2.92775 62.8321 2.1655 56.4175L45.317 2.07103Z" fill="#3ECF8E"/>
            <defs>
              <linearGradient id="paint0_linear" x1="53.9738" y1="54.974" x2="94.1635" y2="71.8295" gradientUnits="userSpaceOnUse">
                <stop stop-color="#249361"/>
                <stop offset="1" stop-color="#3ECF8E"/>
              </linearGradient>
              <linearGradient id="paint1_linear" x1="36.1558" y1="30.578" x2="54.4844" y2="65.0806" gradientUnits="userSpaceOnUse">
                <stop/>
                <stop offset="1" stop-opacity="0"/>
              </linearGradient>
            </defs>
          </svg>
          <span>supabase</span>
        </div>

        <!-- Rio -->
        <div class="cal-logos-logo cal-logos-logo-rio">
          Rio
        </div>

        <!-- Deel -->
        <div class="cal-logos-logo cal-logos-logo-deel">
          deel.
        </div>

        <!-- Framer -->
        <div class="cal-logos-logo cal-logos-logo-framer">
          <svg width="16" height="24" viewBox="0 0 16 24" fill="none">
            <path d="M0 16H8L16 24H0V16Z" fill="black"/>
            <path d="M0 8H16L8 16H0V8Z" fill="black"/>
            <path d="M0 0H16V8H8L0 0Z" fill="black"/>
          </svg>
          <span>Framer</span>
        </div>

        <!-- Ramp -->
        <div class="cal-logos-logo cal-logos-logo-ramp">
          <span>ramp</span>
          <svg width="24" height="16" viewBox="0 0 24 16" fill="none">
            <path d="M4 8H18M18 8L13 3M18 8L13 13" stroke="#84cc16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <!-- PlanetScale -->
        <div class="cal-logos-logo cal-logos-logo-planetscale">
          <svg width="24" height="24" viewBox="0 0 256 256" fill="none">
            <path d="M256 128C256 198.692 198.692 256 128 256C114.564 256 101.634 254.006 89.44 250.306L205.218 134.528C207.732 132.014 209.132 128.612 209.132 125.066C209.132 121.52 207.732 118.118 205.218 115.604L140.396 50.782C136.066 46.452 132.668 43.054 128 43.054C123.332 43.054 119.934 46.452 115.604 50.782L50.782 115.604C46.452 119.934 43.054 123.332 43.054 128C43.054 132.668 46.452 136.066 50.782 140.396L115.604 205.218C118.118 207.732 121.52 209.132 125.066 209.132C128.612 209.132 132.014 207.732 134.528 205.218L250.306 89.44C254.006 101.634 256 114.564 256 128Z" fill="black"/>
            <path d="M0 128C0 57.308 57.308 0 128 0C140.046 0 151.67 1.71 162.68 4.91L4.91 162.68C1.71 151.67 0 140.046 0 128Z" fill="black"/>
          </svg>
          <span>PlanetScale</span>
        </div>
      </div>
    </div>
  </div>
</section>
